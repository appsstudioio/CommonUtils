name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          NOTES_FILE="$(mktemp)"

          if [[ -f CHANGELOG.md ]]; then
            awk -v version="${VERSION}" '
              $0 ~ "^## \\[" version "\\]" {
                capture = 1
                next
              }
              capture && /^## \[/ {
                capture = 0
              }
              capture {
                print
              }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > "${NOTES_FILE}"
          fi

          if [[ -s "${NOTES_FILE}" ]]; then
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --generate-notes
          fi
